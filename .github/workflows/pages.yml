name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST — 새 릴리스 노트를 주워 다시 배포
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GH_TOKEN: ${{ github.token }}   # prebuild 의 릴리스 조회용(익명 한도 회피)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
